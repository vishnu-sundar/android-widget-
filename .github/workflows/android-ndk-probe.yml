name: Android NDK Codex probe
on:
  push:
    branches: [test/android-app-server]
    paths: ['.github/workflows/android-ndk-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.167.0
          path: codex-source
      - name: Configure Android Rust build
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-linux-android
          ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$ndk"
          compiler="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$compiler" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$compiler/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$compiler/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_x86_64_linux_android=$compiler/x86_64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$compiler/llvm-ar" >> "$GITHUB_ENV"
          mkdir -p evidence
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-source/codex-rs
          key: android-x86_64-ndk
          cache-on-failure: true
      - name: Compile official app-server for Android
        working-directory: codex-source/codex-rs
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
          CARGO_BUILD_JOBS: '2'
        shell: bash
        run: |
          set -euo pipefail
          trap 'git diff -- Cargo.lock > ../../evidence/android-lock.diff' EXIT
          cargo +1.95.0 build --release --target x86_64-linux-android -p codex-app-server --bin codex-app-server 2>&1 | tee ../../evidence/ndk-build.txt
          mkdir -p ../../app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/codex-app-server ../../app/src/main/jniLibs/x86_64/libcodex.so
          chmod 755 ../../app/src/main/jniLibs/x86_64/libcodex.so
          file ../../app/src/main/jniLibs/x86_64/libcodex.so | tee ../../evidence/ndk-binary.txt
          sed -i 's/launch("app-server", "--listen", "stdio:\/\/")/launch("--listen", "stdio:\/\/")/' ../../app/src/androidTest/java/dev/codex/usage/NativeCodexProbe.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build probe APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class dev.codex.usage.NativeCodexProbe dev.codex.usage.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/instrumentation.txt
            adb exec-out run-as dev.codex.usage cat files/codex-probe.json > evidence/codex-probe.json
            python3 -m json.tool evidence/codex-probe.json
            adb logcat -d -b crash > evidence/native-crash.txt
            python3 -c 'import json; d=json.load(open("evidence/codex-probe.json")); assert d.get("initializeSucceeded"), "Android native app-server failed to initialize"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ndk-codex-probe
          path: evidence/
