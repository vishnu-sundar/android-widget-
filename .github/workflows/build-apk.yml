name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s bridge -v
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Sign release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_B64:?Missing release keystore}" "${SIGNING_STORE_PASSWORD:?}" "${SIGNING_KEY_ALIAS:?}" "${SIGNING_KEY_PASSWORD:?}"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            evidence/*.png
            app/build/reports/androidTests/connected/
